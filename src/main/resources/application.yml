spring:
  application:
    name: "Ngelmak Project - Core"

  profiles:
    active: dev # or prod

  config.import: optional:vault:// # Enable Vault as a Config Data source. This requires at least one Vault backend to be enabled and resolvable.
  cloud:
    vault:
      uri: http://acemagic:8200
      authentication: approle
      fail-fast: false # Enable fail-fast to force confirmation. Spring Boot to crash immediately when Vault/OpenBao is not reachable
      app-role:
        role-id: 8a23bd57-a50a-79a3-0ae7-4964e5918ac0
        secret-id: 0e66597f-7c9e-7ed8-8b68-897d2646c9ae
      database:
        enabled: false
        backend: database
        role: ngelmak-rw-role
      kv:
        application-name: "" # skip the application name prefix
        enabled: false
        backend: kv
        default-context: jjwt
        profile-separator: "/" # kv/jjwt/dev or kv/jjwt/prod

  datasource:
    # hikari:
    #   initialization-fail-timeout: 0
    url: jdbc:postgresql://ngelmak-pgdb:5432/ngelmakdb
    username: app_migrator
    password: migratorpass

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # Use application-bootstrap.yml for updating the database schema
  data:
    redis:
      host: ngelmak-redis
      port: 6379
      timeout: 60000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  liquibase:
    enabled: false

  jackson:
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart: # Upload limits
      max-file-size: 50MB
      max-request-size: 200MB

  resources:
    cache-period: 86400

server:
  port: 5742

spring.devtools.livereload.port: 35743

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO   # For SQL parameters (Hibernate 6+)
    org.springframework.vault: INFO
    org.springframework.jdbc.datasource: INFO
    org.springframework.boot.autoconfigure: INFO

debug: true

# ================================
# SeaweedFS Storage Configuration
# ================================

# URL of the SeaweedFS Filer service.
# Must include a valid scheme (http:// or https://).
# This is the internal address your backend uses to talk to SeaweedFS.
seaweedfs:
  filer:
    url: http://filer:9555 # Example: http://filer:9555 (filer container) or http://localhost:9555

# Base public URL used to generate file download/view links.
# This is what clients (browsers, mobile apps, external users) will see.
# Typically routed through a reverse proxy, CDN, or domain.
file:
  public:
    base-url: https://storage.ngelmak.org