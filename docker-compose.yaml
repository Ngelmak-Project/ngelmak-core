services:
  # --- Core Service ---
  ngelmak-core:
    build: .
    container_name: ngelmak-core
    ports:
      - "5742:5742"
    volumes:
      - ./data/storage:/ngelmak/ngelmak-core/static/uploads/storage
    restart: unless-stopped
    networks:
      - ngelmak-net

networks:
  ngelmak-net:
    external: true