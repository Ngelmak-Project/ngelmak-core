services:
  # --- Core Service ---
  ngelmak-core:
    build: .
    container_name: ngelmak-core
    ports:
      - "5742:5742"
    restart: on-failure:5
    environment:
      SPRING_PROFILES_ACTIVE: dev # Set the active profile to 'dev' for development, to 'prod' for production.
    networks:
      - ngelmak-net

networks:
  ngelmak-net:
    external: true
