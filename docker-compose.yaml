services:
  # --- Core Service ---
  ngelmak-core:
    build: .
    container_name: ngelmak-core
    ports:
      - "5742:5742"
    restart: on-failure:5
    environment:
      VAULT_ROLE_ID: ${VAULT_ROLE_ID} # Pass the Vault AppRole Role ID as an environment variable
      VAULT_SECRET_ID: ${VAULT_SECRET_ID} # Pass the Vault AppRole Secret
      SPRING_PROFILES_ACTIVE: prod # Set the active profile to 'dev' for development, to 'prod' for production.
    networks:
      - ngelmak-net

networks:
  ngelmak-net:
    external: true
